<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Game for My Girlfriend 💖</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #fffbe9;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #ff69b4;
            margin-top: 30px;
            font-size: 2.5em;
            letter-spacing: 2px;
        }
        .snoopy {
            position: absolute;
            width: 80px;
            z-index: 2;
        }
        .snoopy.left { top: 20px; left: 20px; }
        .snoopy.right { top: 20px; right: 20px; }
        .snoopy.bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 40px auto 20px auto;
            max-width: 600px;
        }
        .heart {
            width: 80px;
            height: 80px;
            background: #ffb6c1;
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,105,180,0.2);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: #fff;
        }
        .heart:hover {
            transform: scale(1.1) rotate(-5deg);
            background: #ff69b4;
        }
        .message {
            text-align: center;
            margin: 20px auto;
            font-size: 1.3em;
            color: #ff69b4;
            min-height: 40px;
            max-width: 500px;
        }
        .easter-egg {
            display: none;
            text-align: center;
            font-size: 1.5em;
            color: #ff1493;
            margin-top: 30px;
            animation: pop 0.7s;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        .photo-area {
            margin: 40px auto 20px auto;
            max-width: 600px;
            text-align: center;
            border: 2px dashed #ffb6c1;
            border-radius: 16px;
            padding: 20px;
            background: #fff;
        }
        .photo-area p {
            color: #888;
            font-size: 1em;
            margin-bottom: 10px;
        }
        /* Responsive */
        @media (max-width: 700px) {
            .game-area, .photo-area { max-width: 95vw; }
            .heart { width: 60px; height: 60px; font-size: 1.5em; }
            .snoopy { width: 60px; }
        }
    </style>
</head>
<body>
    <h1>💖 Reasons Why I Love You 💖</h1>
    <div class="game-area">
        <div class="heart" data-msg="SAYANGG SHASAA!">💗</div>
        <div class="heart" data-msg="I LOVE YOU SHASAAKU">💖</div>
        <div class="heart" data-msg="sayangku cintaku alam semestaku">💘</div>
        <div class="heart" data-msg="semoga nilai rise kita bagus btw wkwkw">💝</div>
        <div class="heart" data-msg="shasaa my lovee">💞</div>
        <div class="heart" data-msg="KITA HARUS NGEDATE hehe">💕</div>
        <div class="heart" data-msg="pokoknya pas pulang haruss ketemuan 😊">💓</div>
        <div class="heart" data-msg="MAUU KANN SHASAA?">💟</div>
        <div class="heart" id="egg" data-msg="(Click again for a surprise!)">💜</div>
    </div>
    <div class="message" id="message"></div>
    <div class="easter-egg" id="easterEgg">🌟 I love you so muchh shasaa 🌟</div>

    <div class="photo-area">
        <p>
            <img id="photo" src="webgf/images/aaaaaa.jpg" alt="Her photo" style="max-width:100%;border-radius:12px;">
        </p>
        <script>
            const photos = [
            "webgf/images/aaaaaa.jpg",
            "webgf/images/kereta.jpg",
            "webgf/images/screenshot1.jpg",
            "webgf/images/screenshot2.jpg",
            "webgf/images/shasaa.png",
            "webgf/images/wokwok.jpg",
            "webgf/images/loll.jpg"
            ];
            let photoIndex = 0;
            const photoEl = document.getElementById('photo');
            setInterval(() => {
            photoIndex = (photoIndex + 1) % photos.length;
            photoEl.src = photos[photoIndex];
            }, 2500);
        </script>
        <p style="text-align:left; margin-left:20px;">Love you shasaaa 😊</p>
    </div>

    <!-- Snoopy images moved below the photos -->
    <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy" class="snoopy left">
    <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy" class="snoopy right">
    <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy" class="snoopy bottom">

    <div style="text-align:center; margin: 30px 0;">
        <audio id="bgAudio" src="https://kind-white-piwnlf5frc.edgeone.app/Daniel%20Caesar%20-%20Superpowers%20(Official%20Audio)%20[rScwLoES2bM].mp3" type="audio/mpeg" loop></audio>
        <button id="playBtn" style="background:#ff69b4;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;margin-top:10px;">
            ▶️ Play Song
        </button>
        <div style="color:#ff69b4; font-size:1em; margin-top:8px;">
            🎶 Superpowers by Daniel Caesar 🎶
        </div>
        <script>
            window.addEventListener('DOMContentLoaded', function() {
                const audio = document.getElementById('bgAudio');
                const playBtn = document.getElementById('playBtn');
                playBtn.style.marginLeft = '0px'; // Move button further to the left
                playBtn.style.marginRight = 'auto';
                playBtn.style.display = 'block';
                playBtn.style.float = 'left';
                playBtn.addEventListener('click', function() {
                    audio.play();
                    playBtn.style.display = 'none';
                });
            });
        </script>
    </div>
    

    <script>
        const hearts = document.querySelectorAll('.heart');
        const message = document.getElementById('message');
        const egg = document.getElementById('egg');
        const easterEgg = document.getElementById('easterEgg');
        let eggClicked = false;

        hearts.forEach(h => {
            h.addEventListener('click', () => {
                if (h === egg) {
                    if (!eggClicked) {
                        message.textContent = h.dataset.msg;
                        eggClicked = true;
                    } else {
                        message.textContent = '';
                        easterEgg.style.display = 'block';
                    }
                } else {
                    message.textContent = h.dataset.msg;
                    easterEgg.style.display = 'none';
                    eggClicked = false;
                }
            });
        });
    </script>
</body>
</html>
